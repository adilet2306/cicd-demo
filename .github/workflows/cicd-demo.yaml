name: CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Prevent overlapping releases for the same branch.
concurrency:
  group: kaizen-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'kaizenacademy/cicd-demo' }}

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v --junitxml=reports/tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: ignore

  dependencies:
    name: Dependencies and licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install auditing tools and runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1 pip-licenses==5.5.5
          python -m venv .runtime
          .runtime/bin/python -m pip install --require-hashes -r requirements.txt
          mkdir -p reports

      - name: Check runtime package licenses
        run: |
          pip-licenses \
            --python=.runtime/bin/python \
            --from=mixed \
            --format=json > reports/licenses.json

          python scripts/check_licenses.py reports/licenses.json

      - name: Audit runtime dependencies
        run: |
          pip-audit \
            --require-hashes \
            -r requirements.txt \
            --format=json \
            --output=reports/dependencies.json

      - name: Upload dependency reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-reports
          path: reports/
          if-no-files-found: ignore

  manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-verified Kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          mkdir -p "$RUNNER_TEMP/kubeconform"
          cd "$RUNNER_TEMP/kubeconform"

          BASE="https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION"

          curl -fsSLO "$BASE/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$BASE/CHECKSUMS"

          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS |
            sha256sum --check --strict

          tar -xzf kubeconform-linux-amd64.tar.gz

          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"

      - name: Validate resource schemas
        run: kubeconform -strict -summary k8s/

  image:
    name: Build, scan, and publish
    needs: [quality, dependencies, manifests]
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image and load into Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2

      - name: Save full image vulnerability report
        run: |
          mkdir -p reports

          trivy image \
            --image-src docker \
            --scanners vuln \
            --format json \
            --output reports/image.json \
            "$IMAGE_REPOSITORY:$GITHUB_SHA"

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        run: |
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE_REPOSITORY:$GITHUB_SHA"

      - name: Upload image report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-scan
          path: reports/
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"

          REF=$(docker image inspect "$IMAGE_REPOSITORY:$GITHUB_SHA" \
            --format '{{index .RepoDigests 0}}')

          DIGEST="${REF##*@}"

          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy and smoke test
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: kubectl

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          use_internal_ip: ${{ vars.GKE_USE_INTERNAL_IP || 'false' }}

      - name: Deploy by immutable digest
        run: |
          python scripts/render_manifests.py \
            --image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --version "$GITHUB_SHA" > rendered.yaml

          kubectl apply -f rendered.yaml

          kubectl -n cicd-demo rollout status \
            deployment/cicd-demo --timeout=240s

      - name: Smoke test the deployed release
        shell: bash
        run: |
          kubectl -n cicd-demo port-forward \
            service/cicd-demo 18080:80 \
            > "$RUNNER_TEMP/cicd-port-forward.log" 2>&1 &

          FORWARD_PID=$!

          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT

          python scripts/smoke_test.py --version "$GITHUB_SHA"

      - name: Inspect deployment on failure
        if: failure()
        run: |
          kubectl -n cicd-demo get deployments,pods,services -o wide
          kubectl -n cicd-demo describe deployment cicd-demo